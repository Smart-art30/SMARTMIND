{% extends "base.html" %}

{% block title %}Quiz Home{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2>Quiz Home</h2>

    {% if enrollments %}
        <ul class="list-group">
            {% for enrollment in enrollments %}
                <li class="list-group-item">
                    {{ enrollment.school_class }}
                </li>
            {% endfor %}
        </ul>
    {% else %}
        <p>No enrollments found.</p>
    {% endif %}
</div>
{% endblock %}
