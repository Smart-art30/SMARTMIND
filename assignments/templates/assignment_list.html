{% extends "base.html" %}
{% block content %}

<h2>My Assignments</h2>

<div class="grid">
  {% for a in assignments %}
    <div class="card">
      <h3>{{ a.title }}</h3>
      <p>{{ a.subject.name }}</p>
      <p>Due: {{ a.due_date }}</p>

      <a class="btn" href="{% url 'assignment_detail' a.id %}">Open</a>

      {% if a.assignment_type == "quiz" %}
        <a class="btn-primary" href="{% url 'start_quiz' a.id %}">Start Quiz</a>
      {% endif %}
    </div>
  {% empty %}
    <p>No assignments available.</p>
  {% endfor %}
</div>

<style>
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px,1fr));
  gap: 20px;
}
.card {
  background: white;
  padding: 20px;
  border-radius: 12px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.05);
}
.btn {
  display: inline-block;
  margin-top: 10px;
}
.btn-primary {
  display: inline-block;
  margin-top: 10px;
  background: #2563eb;
  color: white;
  padding: 6px 10px;
  border-radius: 6px;
}
</style>

{% endblock %}
