{% extends "base.html" %}

{% block title %}Delete Question{% endblock %}

{% block content %}

<div class="container py-5">

<div class="row justify-content-center">

<div class="col-md-8">

<div class="card border-danger shadow">

<div class="card-header bg-danger text-white">

<h4>

<i class="bi bi-trash-fill"></i>

Delete Question

</h4>

</div>

<div class="card-body text-center">

<i class="bi bi-exclamation-triangle-fill text-danger display-2"></i>

<h4 class="mt-3">

Are you sure?

</h4>

<p class="lead">

This question will be permanently deleted.

</p>

<div class="border rounded p-3 bg-light text-start">

{{ question.question|safe }}

</div>

<form method="post" class="mt-4">

{% csrf_token %}

<a href="{% url 'library:question_bank_list' %}"
class="btn btn-secondary">

Cancel

</a>

<button class="btn btn-danger">

Delete Question

</button>

</form>

</div>

</div>

</div>

</div>

</div>

{% endblock %}
