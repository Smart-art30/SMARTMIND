{% extends "base.html" %}
{% block title %}Transfer Enrollment{% endblock %}

{% block content %}
<div class="container py-4" style="max-width:640px;">

    <h3 class="mb-3">Transfer Learner</h3>

    <p class="text-muted">
        <strong>{{ enrollment.student.get_full_name|default:enrollment.student.username }}</strong>
        — currently in <strong>{{ enrollment.school_class.name }}</strong>
    </p>

    <form method="post" class="card p-4">
        {% csrf_token %}

        <label class="form-label">Move to class</label>
        <select name="school_class" class="form-select mb-3" required>
            <option value="">— Select class —</option>
            {% for c in available_classes %}
                <option value="{{ c.id }}">{{ c.name }}</option>
            {% endfor %}
        </select>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Transfer</button>
            <a href="{% url 'enrollment_review_list' %}" class="btn btn-outline-secondary">
                Cancel
            </a>
        </div>
    </form>

</div>
{% endblock %}
